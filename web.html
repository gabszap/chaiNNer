<!DOCTYPE html>
<html lang="en" style="background:#1a202c;color:#e2e8f0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chaiNNer WebUI</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a202c;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .webui-boot {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        height: 100vh;
        font-size: 14px;
        color: #a0aec0;
      }
      .webui-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: #63b3ed;
        border-radius: 50%;
        animation: webui-spin 0.8s linear infinite;
      }
      @keyframes webui-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="webui-boot">
        <div class="webui-spinner"></div>
        <span>Carregando chaiNNer WebUI…</span>
      </div>
    </div>
    <script>
      if (typeof global === 'undefined') {
        var global = window;
      }
    </script>
    <script type="module" src="./src/web/main.ts"></script>
  </body>
</html>
